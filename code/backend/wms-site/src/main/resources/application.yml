server:
  port: 8082

spring:
  application:
    name: wms-site
  threads:
    virtual:
      enabled: true
  datasource:
    # 每个仓一套独立库（D08）：库名带仓标识，连接串由部署注入。
    url: ${WMS_SITE_DB_URL:jdbc:postgresql://localhost:5433/wms_site}
    username: ${WMS_SITE_DB_USERNAME:wms}
    password: ${WMS_SITE_DB_PASSWORD:wms_local}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${WMS_RABBIT_HOST:localhost}
    port: ${WMS_RABBIT_PORT:5672}
    username: ${WMS_RABBIT_USERNAME:wms}
    password: ${WMS_RABBIT_PASSWORD:wms_local}
  jackson:
    mapper:
      allow-coercion-of-scalars: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

wms:
  site:
    # 本仓标识：令牌里的 siteId 必须与它一致，否则按 FORBIDDEN_SITE 拒绝（本仓不一致即越权）。
    id: ${WMS_SITE_ID:0}
  jwt:
    # 与 Hub 同一套签名密钥，单仓端只验签不签发；线上由云上密钥服务注入。
    secret: ${WMS_JWT_SECRET:local-dev-only-secret-key-please-change-32bytes}
  archive:
    # 单仓端限流阈值（端加本仓加接口）。
    rate-limit-per-minute: 120
    downlink:
      # 灰度开关（design「可观测与兼容回滚」）：关闭时单仓只展示已有缓存与待刷新提示。
      enabled: ${WMS_ARCHIVE_DOWNLINK_ENABLED:false}
      queue: ${WMS_ARCHIVE_QUEUE:wms.archive.sku.site}
      exchange: ${WMS_ARCHIVE_EXCHANGE:wms.archive.events}
      routing-key: ${WMS_ARCHIVE_ROUTING_KEY:wms.archive.sku}
    uplink:
      # 变更申请上行到 Hub 的地址（写入 Hub 权威表）。未配置时申请留在本仓待上行，
      # 不伪造成已上行；具体路径与鉴权方式待契约方确认（已登记为契约缺口）。
      url: ${WMS_ARCHIVE_UPLINK_URL:}
      token: ${WMS_ARCHIVE_UPLINK_TOKEN:}
      interval-ms: 30000
      batch-size: 20
  owner:
    # 货主状态下行与受理前闸门（tasks 1.14）：两个开关分开，对应上线顺序的第 ⑤ 步与第 ⑥ 步。
    downlink:
      # 只消费不拦截阶段先打开它；关闭时整个监听组件不装配，单仓不连消息中间件。
      enabled: ${WMS_OWNER_DOWNLINK_ENABLED:false}
      queue: ${WMS_OWNER_QUEUE:wms.owner.status.site}
      exchange: ${WMS_ARCHIVE_EXCHANGE:wms.archive.events}
      routing-key: ${WMS_OWNER_ROUTING_KEY:wms.owner.status}
      # 死信队列：消费失败的消息由队列的死信交换投到这里，供按 eventId 重放；拓扑由部署配置声明。
      dead-letter-queue: ${WMS_OWNER_DEAD_LETTER_QUEUE:wms.owner.status.dlq}
    blocking:
      # 受理前闸门：默认关闭，副本覆盖率确认后再打开；回滚即关闭（恢复「不拦截」）。
      enabled: ${WMS_OWNER_BLOCKING_ENABLED:false}
      # 副本数据超过该时长未更新即视为长期失联，闸门拒绝放行；与告警阈值 5 分钟错开。
      stale-threshold: ${WMS_OWNER_BLOCKING_STALE_THRESHOLD:1h}

management:
  endpoints:
    web:
      exposure:
        # metrics 与 Hub 侧同一口径：tasks 1.18 要求「指标可在本地端点观察」，
        # 闸门的两项指标（拒绝按原因、放行、副本未命中）在单仓端，不暴露就读不到。
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
