server:
  port: 8081

spring:
  application:
    name: wms-hub
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${WMS_DB_URL:jdbc:postgresql://localhost:5433/wms_hub}
    username: ${WMS_DB_USERNAME:wms}
    password: ${WMS_DB_PASSWORD:wms_local}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${WMS_REDIS_HOST:localhost}
      port: ${WMS_REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    # 下行事件的消息中间件（01 选型：RabbitMQ）；线上由云上托管实例提供，地名为占位符。
    host: ${WMS_RABBIT_HOST:localhost}
    port: ${WMS_RABBIT_PORT:5672}
    username: ${WMS_RABBIT_USERNAME:wms}
    password: ${WMS_RABBIT_PASSWORD:wms_local}
  jackson:
    # 契约「标识、类型与枚举约定」：标识一律为十进制字符串，入参数字形态按 COMMON_9001 拒绝，
    # 不靠 Jackson 的隐式标量转换兜底；version 仍是 JSON 整数。
    mapper:
      allow-coercion-of-scalars: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: none

wms:
  owner:
    acceptance:
      # 受理结果查询的轮询上限（契约 1.3「恢复」、12a 的 UI-F02）：超过仍在处理中即返回可重试的 503，
      # 调用方保留受理号；后台补偿扫描在 300 秒后把陈旧受理单收尾成 FAILED。
      processing-timeout-seconds: ${WMS_OWNER_ACCEPTANCE_TIMEOUT_SECONDS:60}
    metrics:
      # 受理积压指标的刷新间隔（tasks 1.18）。
      backlog-interval-ms: ${WMS_OWNER_METRICS_INTERVAL_MS:60000}
    outbox:
      # 货主状态下行的路由键（tasks 1.13）：投递器按 event_type 的 OWNER 前缀选它。
      routing-key: ${WMS_OWNER_ROUTING_KEY:wms.owner.status}
      # 重试耗尽后的死信队列，供按 eventId 重放；队列本身由部署配置声明，代码不声明拓扑。
      dead-letter-queue: ${WMS_OWNER_DEAD_LETTER_QUEUE:wms.owner.status.dlq}
      # 死信阈值：失败次数达到它即转发死信并告警（缺省 5 次，按指数退避约 30 分钟）。
      dead-letter-threshold: ${WMS_OWNER_DEAD_LETTER_THRESHOLD:5}
  jwt:
    # 本地开发默认值；线上由云上密钥服务注入，仓库不存真实密钥。
    secret: ${WMS_JWT_SECRET:local-dev-only-secret-key-please-change-32bytes}
    access-token-minutes: 30
    refresh-token-days: 7
  auth:
    login-limit-per-minute: 10
  archive:
    # 端加货主加接口维度的限流阈值（契约「限流与超时」）。
    rate-limit-per-minute: 120
    outbox:
      # 本地消息投递器：间隔与批量由部署配置给出。
      interval-ms: 30000
      batch-size: 50
      exchange: ${WMS_ARCHIVE_EXCHANGE:wms.archive.events}
      routing-key: ${WMS_ARCHIVE_ROUTING_KEY:wms.archive.sku}
    site-registry:
      # 站点登记（API-018、API-019 的凭证来源）。线上由密钥服务注入凭证；
      # 一个 siteCode 只能声明一个本仓，声明多个即「多仓声明」，按 FORBIDDEN_SITE 拒绝。
      sites: []
  bootstrap:
    # 冷启动引导管理员：账号表为空时创建，仅首次生效；线上必须用环境变量覆盖。
    admin-name: ${WMS_BOOTSTRAP_ADMIN:admin}
    admin-password: ${WMS_BOOTSTRAP_PASSWORD:Admin@12345}

management:
  endpoints:
    web:
      exposure:
        # metrics 对外暴露：tasks 1.18 要求「指标可在本地端点观察」（/actuator/metrics/{name}）。
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
