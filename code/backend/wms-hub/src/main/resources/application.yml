server:
  port: 8081

spring:
  application:
    name: wms-hub
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${WMS_DB_URL:jdbc:postgresql://localhost:5433/wms_hub}
    username: ${WMS_DB_USERNAME:wms}
    password: ${WMS_DB_PASSWORD:wms_local}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${WMS_REDIS_HOST:localhost}
      port: ${WMS_REDIS_PORT:6379}
      timeout: 2s
  rabbitmq:
    # 下行事件的消息中间件（01 选型：RabbitMQ）；线上由云上托管实例提供，地名为占位符。
    host: ${WMS_RABBIT_HOST:localhost}
    port: ${WMS_RABBIT_PORT:5672}
    username: ${WMS_RABBIT_USERNAME:wms}
    password: ${WMS_RABBIT_PASSWORD:wms_local}
  jackson:
    # 契约「标识、类型与枚举约定」：标识一律为十进制字符串，入参数字形态按 COMMON_9001 拒绝，
    # 不靠 Jackson 的隐式标量转换兜底；version 仍是 JSON 整数。
    mapper:
      allow-coercion-of-scalars: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: none

wms:
  jwt:
    # 本地开发默认值；线上由云上密钥服务注入，仓库不存真实密钥。
    secret: ${WMS_JWT_SECRET:local-dev-only-secret-key-please-change-32bytes}
    access-token-minutes: 30
    refresh-token-days: 7
  auth:
    login-limit-per-minute: 10
  archive:
    # 端加货主加接口维度的限流阈值（契约「限流与超时」）。
    rate-limit-per-minute: 120
    outbox:
      # 本地消息投递器：间隔与批量由部署配置给出。
      interval-ms: 30000
      batch-size: 50
      exchange: ${WMS_ARCHIVE_EXCHANGE:wms.archive.events}
      routing-key: ${WMS_ARCHIVE_ROUTING_KEY:wms.archive.sku}
    site-registry:
      # 站点登记（API-018、API-019 的凭证来源）。线上由密钥服务注入凭证；
      # 一个 siteCode 只能声明一个本仓，声明多个即「多仓声明」，按 FORBIDDEN_SITE 拒绝。
      sites: []
  bootstrap:
    # 冷启动引导管理员：账号表为空时创建，仅首次生效；线上必须用环境变量覆盖。
    admin-name: ${WMS_BOOTSTRAP_ADMIN:admin}
    admin-password: ${WMS_BOOTSTRAP_PASSWORD:Admin@12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
